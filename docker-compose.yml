services:
  vietnam-dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      PYTHONUTF8: "1"
      WEBUI_HOST: "0.0.0.0"
      MARKET: "VN"
      STOCK_LIST: "FPT,VPB,MSB,SCS,ACV,ACB"
      PORT: "8000"
      MOZYFIN_API_KEY: ${MOZYFIN_API_KEY:-}
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./reports:/app/reports

    # Local fixture mode only. Do not enable this on Render or production hosts.
    # environment:
    #   MOZYFIN_FIXTURE_DIR: /app/tests/fixtures/mozyfin
    # volumes:
    #   - ./tests/fixtures/mozyfin:/app/tests/fixtures/mozyfin:ro
